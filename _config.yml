title: Bayesian Inference LAB
description: Bayesian parametric and nonparametric modeling, Bayesian computation, and uncertainty-aware data science at INHA University.
url: "https://bayesian-inference-lab.github.io"
baseurl: ""
lang: en
timezone: Asia/Seoul

markdown: kramdown
permalink: pretty

plugins:
  - jekyll-sitemap

navigation:
  - title: Home
    url: /
  - title: People
    url: /people/
  - title: Publications
    url: /publications/
  - title: Software
    url: /software/
  - title: Photo
    url: /photo/

defaults:
  - scope:
      path: ""
    values:
      layout: default

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - .bundle
  - _site
  - "*.log"
